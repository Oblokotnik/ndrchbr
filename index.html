<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подвал: Выживание</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="mainMenu" class="screen active">
        <div class="menu-content">
            <h1 class="game-title">ПОДВАЛ</h1>
            <p class="subtitle">Выживание начинается</p>
            <div class="story-text">
                <p>Вы и трое других людей заперты в подвале дома.</p>
                <p>Снаружи что-то есть.</p>
                <p>Ресурсы ограничены. Время работает против вас.</p>
            </div>
            <button class="start-btn" onclick="startGame()">НАЧАТЬ</button>
            <div class="controls-info">
                <p>Управление: кликайте по объектам для взаимодействия</p>
            </div>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="gameScreen" class="screen">
        <!-- UI Ресурсов -->
        <div class="ui-panel">
            <div class="resource">
                <span class="resource-icon">🍞</span>
                <span class="resource-value" id="foodCount">10</span>
            </div>
            <div class="resource">
                <span class="resource-icon">💧</span>
                <span class="resource-value" id="waterCount">5</span>
            </div>
            <div class="resource">
                <span class="resource-icon">❤️</span>
                <span class="resource-value" id="healthCount">100</span>
            </div>
            <div class="resource">
                <span class="resource-icon">📅</span>
                <span class="resource-value" id="dayCount">1</span>
            </div>
        </div>

        <!-- Сцена подвала -->
        <div class="basement-scene" id="basementScene">
            <!-- Стены подвала -->
            <div class="wall wall-left"></div>
            <div class="wall wall-right"></div>
            <div class="wall wall-back"></div>
            <div class="floor"></div>

            <!-- Люк -->
            <div class="hatch" id="hatch" onclick="interactHatch()">
                <div class="hatch-cover"></div>
                <div class="hatch-handle"></div>
            </div>

            <!-- Бойлер -->
            <div class="boiler" id="boiler" onclick="interactBoiler()">
                <div class="boiler-body"></div>
                <div class="boiler-wheel" id="boilerWheel"></div>
                <div class="boiler-pipe"></div>
                <div class="water-indicator" id="waterIndicator"></div>
            </div>

            <!-- Кровать -->
            <div class="bed" id="bed" onclick="interactBed()">
                <div class="bed-mattress"></div>
                <div class="bed-pillow"></div>
            </div>

            <!-- Люди (NPC) -->
            <div class="npc npc-1" id="npc1">
                <div class="npc-body"></div>
                <div class="npc-head"></div>
            </div>
            <div class="npc npc-2" id="npc2">
                <div class="npc-body"></div>
                <div class="npc-head"></div>
            </div>
            <div class="npc npc-3" id="npc3">
                <div class="npc-body"></div>
                <div class="npc-head"></div>
            </div>

            <!-- Монстры за дверью (тени) -->
            <div class="monsters-shadow" id="monstersShadow"></div>

            <!-- Эффекты -->
            <div class="darkness-overlay" id="darknessOverlay"></div>
            <div class="vignette"></div>
        </div>

        <!-- Панель действий -->
        <div class="action-panel" id="actionPanel">
            <div class="action-text" id="actionText">Выберите действие</div>
            <div class="action-buttons" id="actionButtons"></div>
        </div>

        <!-- Индикатор кручения бойлера -->
        <div class="crank-indicator" id="crankIndicator">
            <div class="crank-circle"></div>
            <div class="crank-progress" id="crankProgress"></div>
            <div class="crank-text">КРУТИТЕ!</div>
        </div>
    </div>

    <!-- ЭКРАН СНА -->
    <div id="sleepScreen" class="screen">
        <div class="sleep-content">
            <div class="sleep-text">Вы засыпаете...</div>
            <div class="sleep-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- СКРИМЕР ЭКРАН -->
    <div id="screamerScreen" class="screen">
        <div class="screamer-content">
            <div class="first-person-view">
                <div class="boiler-closeup">
                    <div class="boiler-front"></div>
                    <div class="boiler-wheel-big"></div>
                </div>
                <div class="monster-emerge" id="monsterEmerge">
                    <div class="monster-face">
                        <div class="monster-eye left"></div>
                        <div class="monster-eye right"></div>
                        <div class="monster-mouth"></div>
                    </div>
                    <div class="monster-hands"></div>
                </div>
            </div>
            <div class="screamer-flash" id="screamerFlash"></div>
        </div>
    </div>

    <!-- ЭКРАН КОНЦОВКИ -->
    <div id="endScreen" class="screen">
        <div class="end-content">
            <h1 class="end-title" id="endTitle">КОНЕЦ</h1>
            <p class="end-text" id="endText"></p>
            <button class="restart-btn" onclick="location.reload()">НАЧАТЬ ЗАНОВО</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
